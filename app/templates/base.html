<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Punch!{% endblock %}</title>
  <link rel="icon" href="/static/punch_icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f2f0eb">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('punch_theme'); } catch (_) {}
      if (theme !== 'dark' && theme !== 'light') {
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#131720' : '#f2f0eb');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=dark30">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <img class="brand-icon" src="/static/punch_icon.svg" alt="" width="26" height="26">
        <span class="brand-dot" style="{% if live and not live.clocked_in %}background:var(--text-dim);box-shadow:none;{% endif %}"></span>
        <span>Punch!</span>
      </a>
      <nav class="nav">
        <a href="/" class="{% if active_nav == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/months/{{ nav_ym }}" class="{% if active_nav == 'month' %}active{% endif %}">Month Editor</a>
        <a href="/settings" class="{% if active_nav == 'settings' %}active{% endif %}">Settings</a>
        <span class="user-pill">{{ user.display_name }} · {{ user.timezone }}</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if flash %}
    <div class="alert {% if flash_kind == 'error' %}alert-err{% elif flash_kind == 'warn' %}alert-warn{% else %}alert-ok{% endif %}">
      {{ flash }}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script>
    (function () {
      const timerEl = document.getElementById('live-elapsed');
      if (timerEl && timerEl.dataset.startHm && timerEl.dataset.startDate) {
        const startDate = timerEl.dataset.startDate;
        const parts = timerEl.dataset.startHm.split(':');
        const baseCompleted = parseInt(timerEl.dataset.completedMin || '0', 10);
        const totalEl = document.getElementById('live-today-total');

        function tick() {
          const now = new Date();
          const yyyy = now.getFullYear();
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          const todayIso = yyyy + '-' + mm + '-' + dd;
          if (todayIso !== startDate) return;

          const startDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(parts[0], 10), parseInt(parts[1], 10), 0);
          const diffSec = Math.max(0, Math.floor((now - startDt) / 1000));
          const hh = String(Math.floor(diffSec / 3600)).padStart(2, '0');
          const mi = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
          const ss = String(diffSec % 60).padStart(2, '0');
          timerEl.textContent = hh + ':' + mi + ':' + ss;

          if (totalEl) {
            const totalMin = baseCompleted + Math.floor(diffSec / 60);
            const th = String(Math.floor(totalMin / 60)).padStart(2, '0');
            const tm = String(totalMin % 60).padStart(2, '0');
            totalEl.textContent = th + ':' + tm;
          }
        }
        tick();
        setInterval(tick, 1000);
      }

      const dz = document.getElementById('atoss-dropzone');
      const fileInput = document.getElementById('atoss-file-input');
      if (dz && fileInput) {
        dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('dragover'); });
        dz.addEventListener('dragleave', function () { dz.classList.remove('dragover'); });
        dz.addEventListener('drop', function (e) {
          e.preventDefault();
          dz.classList.remove('dragover');
          if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
          }
        });
      }

      try {
        const savedPath = sessionStorage.getItem('atoss_scroll_path');
        const savedY = sessionStorage.getItem('atoss_scroll_y');
        sessionStorage.removeItem('atoss_scroll_path');
        sessionStorage.removeItem('atoss_scroll_y');
        if (savedY !== null && savedPath === window.location.pathname) {
          const targetY = parseInt(savedY, 10);
          if (!Number.isNaN(targetY)) {
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            window.scrollTo(0, targetY);
            requestAnimationFrame(function () { window.scrollTo(0, targetY); });
            window.addEventListener('load', function () {
              window.scrollTo(0, targetY);
              if ('scrollRestoration' in history) {
                history.scrollRestoration = 'auto';
              }
            }, { once: true });
          }
        }
      } catch (_) {}

      document.addEventListener('submit', function (e) {
        const form = e.target;
        if (!(form instanceof HTMLFormElement)) return;
        if (!form.closest('.month-table, #today-editor, .issue-item, .btn-row')) return;
        if (form.action && (form.action.includes('/ai-assist') || form.action.includes('/upload-atoss'))) return;
        try {
          sessionStorage.setItem('atoss_scroll_y', String(window.scrollY));
          sessionStorage.setItem('atoss_scroll_path', window.location.pathname);
          sessionStorage.setItem('punch_submitted', '1');
        } catch (_) {}
      });

      // After a genuine anchor navigation (issue/proposal links) re-open the day
      // panel. After a form submit the redirect also carries #day-..., but there
      // the panel and edit forms should stay closed.
      try {
        const submitted = sessionStorage.getItem('punch_submitted');
        sessionStorage.removeItem('punch_submitted');
        sessionStorage.removeItem('punch_edit_entry');
        if (!submitted) {
          const m = (window.location.hash || '').match(/^#day-(\d{4}-\d{2}-\d{2})$/);
          if (m) openDayAdd(m[1]);
        }
      } catch (_) {}

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#131720' : '#f2f0eb');
      }

      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          try { localStorage.setItem('punch_theme', next); } catch (_) {}
        });
      }

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
          var saved = null;
          try { saved = localStorage.getItem('punch_theme'); } catch (_) {}
          if (saved !== 'dark' && saved !== 'light') {
            applyTheme(e.matches ? 'dark' : 'light');
          }
        });
      }
    })();

    function openEditRow(id) {
      const form = document.getElementById('edit-entry-' + id);
      const view = document.getElementById('pill-view-' + id);
      if (form) form.classList.add('open');
      if (view) view.style.display = 'none';
    }

    function closeEditRow(id) {
      const form = document.getElementById('edit-entry-' + id);
      const view = document.getElementById('pill-view-' + id);
      if (form) form.classList.remove('open');
      if (view) view.style.display = 'flex';
    }

    function toggleEditRow(id) {
      const form = document.getElementById('edit-entry-' + id);
      if (!form) return;
      if (form.classList.contains('open')) closeEditRow(id); else openEditRow(id);
    }

    function openDayAdd(date) {
      const el = document.getElementById('day-add-' + date);
      if (el) el.classList.add('open');
      const btn = document.getElementById('day-add-btn-' + date);
      if (btn) btn.textContent = 'close';
    }

    function closeDayAdd(date) {
      const el = document.getElementById('day-add-' + date);
      if (el) el.classList.remove('open');
      const btn = document.getElementById('day-add-btn-' + date);
      if (btn) btn.textContent = '+ add interval';
    }

    function toggleDayAdd(date) {
      const el = document.getElementById('day-add-' + date);
      if (!el) return;
      if (el.classList.contains('open')) closeDayAdd(date); else openDayAdd(date);
    }

    function openDayMeta(date) {
      const el = document.getElementById('day-meta-' + date);
      if (el) el.classList.add('open');
    }

    function closeDayMeta(date) {
      const el = document.getElementById('day-meta-' + date);
      if (el) el.classList.remove('open');
    }

    function toggleDayMeta(date) {
      const el = document.getElementById('day-meta-' + date);
      if (!el) return;
      if (el.classList.contains('open')) closeDayMeta(date); else openDayMeta(date);
    }

    function setAiPrompt(text) {
      const input = document.getElementById('ai-instruction-input');
      if (input) {
        input.value = text;
        input.focus();
      }
    }

    function aiElapsedLabel(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return m > 0 ? m + ':' + String(s).padStart(2, '0') : s + 's';
    }

    function aiSetStatus(kind, text, seconds, statusId) {
      const statusEl = document.getElementById(statusId || 'ai-status');
      if (!statusEl) return;
      statusEl.hidden = false;
      statusEl.className = 'ai-status is-' + kind;
      statusEl.innerHTML = (kind === 'busy' ? '<span class="ai-spinner" aria-hidden="true"></span>' : '') +
        '<span class="ai-status-text"></span>' +
        '<span class="ai-elapsed tnum"></span>';
      statusEl.querySelector('.ai-status-text').textContent = text;
      statusEl.querySelector('.ai-elapsed').textContent = aiElapsedLabel(seconds);
    }

    async function runAiAssist(form, submitter) {
      const buttons = form.querySelectorAll('button');
      const host = document.getElementById('proposals-host');
      const mode = submitter && submitter.value ? submitter.value : 'ai';
      const label = form.dataset.aiLabel || 'the AI provider';
      const started = Date.now();
      const body = new FormData(form);
      body.set('mode', mode);

      buttons.forEach(function (b) { b.disabled = true; });
      aiSetStatus('busy', (mode === 'heuristic' ? 'Running the offline rule scan' : 'Waiting for ' + label) + '…', 0);
      const elapsedEl = document.querySelector('#ai-status .ai-elapsed');
      const timer = setInterval(function () {
        if (elapsedEl) elapsedEl.textContent = aiElapsedLabel(Math.round((Date.now() - started) / 1000));
      }, 500);

      let payload = null;
      let failure = '';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: body,
          headers: { 'X-Requested-With': 'fetch' },
          credentials: 'same-origin',
        });
        payload = await res.json().catch(function () { return null; });
        if (!res.ok || !payload || !payload.ok) {
          failure = (payload && payload.error) ||
            (payload ? 'Request failed with status ' + res.status : 'Unexpected response from the server — reload the page and try again.');
        }
      } catch (err) {
        failure = 'Network error: ' + err.message;
      } finally {
        clearInterval(timer);
        buttons.forEach(function (b) { b.disabled = false; });
      }

      const seconds = Math.round((Date.now() - started) / 1000);
      if (failure) {
        aiSetStatus('error', failure, seconds);
        return;
      }

      if (host) host.innerHTML = payload.proposals_html || '';
      const parts = [];
      if (payload.changes) parts.push(payload.changes + (payload.changes === 1 ? ' edit' : ' edits'));
      if (payload.suspicious_days) {
        parts.push(payload.suspicious_days + (payload.suspicious_days === 1 ? ' day flagged' : ' days flagged'));
      }
      if (payload.reasoning_tokens) parts.push(payload.reasoning_tokens + ' thinking tokens');
      const note = payload.reasoning_note ? ' · ' + payload.reasoning_note : '';
      aiSetStatus('ok', 'Proposal ready' + (parts.length ? ' · ' + parts.join(' · ') : '') + note, seconds);
      const proposals = document.getElementById('proposals');
      if (proposals) proposals.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.addEventListener('submit', function (e) {
      const form = e.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (!form.action || !form.action.includes('/ai-assist')) return;
      e.preventDefault();
      runAiAssist(form, e.submitter);
    });
  </script>
</body>
</html>
